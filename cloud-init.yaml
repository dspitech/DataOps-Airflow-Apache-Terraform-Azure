#cloud-config
# ============================================================
# cloud-init FULL AUTO — TP6 DataOps
# CORRECTIF : write_files écrit TOUT sous /opt/dataops-staging/
# (root:root) car l'utilisateur dataops_admin n'existe pas encore.
# runcmd crée la structure finale et corrige les permissions.
# ============================================================

package_update: true
package_upgrade: false

packages:
  - git
  - curl
  - wget
  - unzip
  - python3
  - python3-pip
  - python3-venv
  - python3-full
  - jq
  - make
  - build-essential
  - ca-certificates
  - gnupg
  - lsb-release
  - sqlite3
  - tree

write_files:

  # ─────────────────────────────────────────────
  # Tous les fichiers sont écrits sous /opt/dataops-staging/
  # (root:root) — runcmd les déplacera vers /home/dataops_admin/
  # ─────────────────────────────────────────────

  - path: /opt/dataops-staging/env.global
    owner: root:root
    permissions: "0600"
    content: |
      AZURE_STORAGE_CONNECTION_STRING="${storage_connection_string}"
      AIRFLOW_ADMIN_PASSWORD="${airflow_admin_password}"

  - path: /opt/dataops-staging/airflow.env
    owner: root:root
    permissions: "0600"
    content: |
      AIRFLOW_UID=1000
      AIRFLOW_GID=0
      _AIRFLOW_WWW_USER_USERNAME=airflow
      _AIRFLOW_WWW_USER_PASSWORD=${airflow_admin_password}
      _PIP_ADDITIONAL_REQUIREMENTS=dbt-core dbt-sqlite azure-storage-blob

  - path: /opt/dataops-staging/profiles.yml
    owner: root:root
    permissions: "0644"
    content: |
      dataops_dbt:
        target: dev
        outputs:
          dev:
            type: sqlite
            threads: 1
            database: dataops
            schema: main
            schemas_and_paths:
              main: "/opt/airflow/project/database/dataops.db"
            schema_directory: "/opt/airflow/project/database"

  - path: /opt/dataops-staging/upload_blob.py
    owner: root:root
    permissions: "0755"
    content: |
      import os
      import json
      from datetime import datetime
      from pathlib import Path
      from azure.storage.blob import BlobServiceClient

      CONTAINER_NAME = "raw"
      DATABASE_DIR   = Path("/opt/airflow/project/database")

      def get_connection_string():
          cs = os.getenv("AZURE_STORAGE_CONNECTION_STRING")
          if not cs:
              raise EnvironmentError("AZURE_STORAGE_CONNECTION_STRING manquant.")
          return cs

      def upload_file():
          cs  = get_connection_string()
          now = datetime.utcnow()
          payload = {
              "message": f"hello azure depuis airflow - {now.isoformat()}",
              "source": "tp6-airflow",
              "timestamp": now.isoformat()
          }
          DATABASE_DIR.mkdir(parents=True, exist_ok=True)
          local_file = DATABASE_DIR / "test.json"
          local_file.write_text(json.dumps(payload))
          blob_name = (
              f"dataops/year={now.year}/month={now.month:02d}/"
              f"day={now.day:02d}/test_{now.strftime('%H%M%S')}.json"
          )
          client    = BlobServiceClient.from_connection_string(cs)
          container = client.get_container_client(CONTAINER_NAME)
          try:
              container.create_container()
              print(f"Container créé : {CONTAINER_NAME}")
          except Exception:
              print(f"Container existant : {CONTAINER_NAME}")
          blob = client.get_blob_client(container=CONTAINER_NAME, blob=blob_name)
          with open(local_file, "rb") as f:
              blob.upload_blob(f, overwrite=True)
          print(f"Upload réussi : {blob_name}")

      if __name__ == "__main__":
          upload_file()

  - path: /opt/dataops-staging/load_blob_to_sql.py
    owner: root:root
    permissions: "0755"
    content: |
      import os
      import json
      import sqlite3
      from pathlib import Path
      from azure.storage.blob import BlobServiceClient

      CONTAINER_NAME = "raw"
      DATABASE_PATH  = Path("/opt/airflow/project/database/dataops.db")

      def get_connection_string():
          cs = os.getenv("AZURE_STORAGE_CONNECTION_STRING")
          if not cs:
              raise EnvironmentError("AZURE_STORAGE_CONNECTION_STRING manquant.")
          return cs

      def create_database():
          DATABASE_PATH.parent.mkdir(parents=True, exist_ok=True)
          conn   = sqlite3.connect(DATABASE_PATH)
          cursor = conn.cursor()
          cursor.execute("""
              CREATE TABLE IF NOT EXISTS stg_blob_files (
                  id          INTEGER PRIMARY KEY AUTOINCREMENT,
                  source_file TEXT UNIQUE,
                  message     TEXT,
                  loaded_at   TEXT DEFAULT (datetime('now'))
              )
          """)
          conn.commit()
          conn.close()
          print("Base SQLite prête.")

      def load_blobs():
          cs     = get_connection_string()
          client = BlobServiceClient.from_connection_string(cs)
          blobs  = client.get_container_client(CONTAINER_NAME).list_blobs()
          conn   = sqlite3.connect(DATABASE_PATH)
          cursor = conn.cursor()
          count  = 0
          for blob in blobs:
              blob_name = blob.name
              bc        = client.get_blob_client(container=CONTAINER_NAME, blob=blob_name)
              data      = json.loads(bc.download_blob().readall())
              message   = data.get("message")
              cursor.execute(
                  "INSERT OR IGNORE INTO stg_blob_files (source_file, message) VALUES (?, ?)",
                  (blob_name, message)
              )
              if cursor.rowcount > 0:
                  count += 1
                  print(f"Chargé : {blob_name}")
          conn.commit()
          conn.close()
          print(f"Chargement terminé — {count} nouveaux fichiers.")

      if __name__ == "__main__":
          create_database()
          load_blobs()

  - path: /opt/dataops-staging/dataops_pipeline_dag.py
    owner: root:root
    permissions: "0644"
    content: |
      from datetime import datetime, timedelta
      from airflow import DAG
      from airflow.operators.bash import BashOperator

      PROJECT_DIR   = "/opt/airflow/project"
      DBT_DIR       = f"{PROJECT_DIR}/dataops_dbt"
      PROFILES_DIR  = f"{PROJECT_DIR}/.dbt"

      default_args = {
          "owner"           : "dataops",
          "depends_on_past" : False,
          "email_on_failure": False,
          "email_on_retry"  : False,
          "retries"         : 1,
          "retry_delay"     : timedelta(minutes=2),
      }

      with DAG(
          dag_id          = "dataops_pipeline",
          description     = "Pipeline DataOps : Blob -> SQLite -> dbt run -> dbt test",
          default_args    = default_args,
          start_date      = datetime(2026, 1, 1),
          schedule        = "0 */6 * * *",
          catchup         = False,
          max_active_runs = 1,
          tags            = ["dataops", "dbt", "blob", "sqlite"],
      ) as dag:

          upload_blob = BashOperator(
              task_id      = "upload_blob",
              bash_command = f"cd {PROJECT_DIR} && python3 scripts/upload_blob.py",
              env={"AZURE_STORAGE_CONNECTION_STRING": "{{ var.value.azure_storage_connection_string }}"},
          )

          load_sqlite = BashOperator(
              task_id      = "load_sqlite",
              bash_command = f"cd {PROJECT_DIR} && python3 scripts/load_blob_to_sql.py",
              env={"AZURE_STORAGE_CONNECTION_STRING": "{{ var.value.azure_storage_connection_string }}"},
          )

          dbt_run = BashOperator(
              task_id      = "dbt_run",
              bash_command = f"dbt run --project-dir {DBT_DIR} --profiles-dir {PROFILES_DIR}",
          )

          dbt_test = BashOperator(
              task_id      = "dbt_test",
              bash_command = f"dbt test --project-dir {DBT_DIR} --profiles-dir {PROFILES_DIR}",
          )

          upload_blob >> load_sqlite >> dbt_run >> dbt_test

  - path: /opt/dataops-staging/analytics_messages.sql
    owner: root:root
    permissions: "0644"
    content: |
      SELECT
          source_file,
          message
      FROM stg_blob_files
      WHERE message IS NOT NULL

  - path: /opt/dataops-staging/schema.yml
    owner: root:root
    permissions: "0644"
    content: |
      version: 2

      models:
        - name: analytics_messages
          description: "Couche analytique — messages extraits des fichiers blob Azure."
          columns:
            - name: source_file
              description: "Chemin du fichier source dans le blob storage Azure."
              tests:
                - unique
                - not_null
            - name: message
              description: "Contenu du message extrait du JSON."
              tests:
                - not_null

  # ─────────────────────────────────────────────
  # Script de déploiement Airflow (root:root, pas de problème)
  # ─────────────────────────────────────────────
  - path: /opt/deploy_airflow.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      LOGFILE="/var/log/deploy_airflow.log"
      exec > >(tee -a "$LOGFILE") 2>&1

      echo "=========================================="
      echo "$(date) — Démarrage deploy_airflow.sh"
      echo "=========================================="

      ADMIN_USER="${admin_username}"
      PROJECT_DIR="/home/$ADMIN_USER/dataops-project"
      AIRFLOW_DIR="$PROJECT_DIR/airflow"
      AIRFLOW_VERSION="2.9.3"

      # ── 1. Attendre que l'utilisateur soit créé ──────────────
      echo "$(date) — Attente création utilisateur $ADMIN_USER..."
      until id "$ADMIN_USER" &>/dev/null; do sleep 2; done
      echo "$(date) — Utilisateur $ADMIN_USER OK"

      # ── 2. Créer la structure de dossiers ────────────────────
      echo "$(date) — Création structure projet..."
      mkdir -p "$AIRFLOW_DIR/dags"
      mkdir -p "$AIRFLOW_DIR/logs"
      mkdir -p "$AIRFLOW_DIR/plugins"
      mkdir -p "$AIRFLOW_DIR/config"
      mkdir -p "$PROJECT_DIR/database"
      mkdir -p "$PROJECT_DIR/scripts"
      mkdir -p "$PROJECT_DIR/.dbt"
      mkdir -p "$PROJECT_DIR/dbt_models"

      # ── 3. Déplacer les fichiers depuis le staging ────────────
      echo "$(date) — Déplacement des fichiers depuis /opt/dataops-staging/..."
      cp /opt/dataops-staging/env.global         "$PROJECT_DIR/.env.global"
      cp /opt/dataops-staging/airflow.env        "$AIRFLOW_DIR/.env"
      cp /opt/dataops-staging/profiles.yml       "$PROJECT_DIR/.dbt/profiles.yml"
      cp /opt/dataops-staging/upload_blob.py     "$PROJECT_DIR/scripts/upload_blob.py"
      cp /opt/dataops-staging/load_blob_to_sql.py "$PROJECT_DIR/scripts/load_blob_to_sql.py"
      cp /opt/dataops-staging/dataops_pipeline_dag.py "$AIRFLOW_DIR/dags/dataops_pipeline_dag.py"
      cp /opt/dataops-staging/analytics_messages.sql  "$PROJECT_DIR/dbt_models/analytics_messages.sql"
      cp /opt/dataops-staging/schema.yml         "$PROJECT_DIR/dbt_models/schema.yml"
      echo "$(date) — Fichiers copiés"

      # ── 4. Attendre Docker ───────────────────────────────────
      echo "$(date) — Attente Docker..."
      until docker info &>/dev/null; do sleep 3; done
      echo "$(date) — Docker OK"

      # ── 5. Télécharger docker-compose officiel Airflow ───────
      echo "$(date) — Téléchargement docker-compose Airflow $AIRFLOW_VERSION..."
      curl -Lf \
        "https://airflow.apache.org/docs/apache-airflow/$${AIRFLOW_VERSION}/docker-compose.yaml" \
        -o "$AIRFLOW_DIR/docker-compose.yaml"
      echo "$(date) — docker-compose.yaml téléchargé"

      # ── 6. Monter le dossier projet dans les conteneurs ──────
      sed -i \
        "/- \.\/plugins:\/opt\/airflow\/plugins/a\\      - $${PROJECT_DIR}:/opt/airflow/project" \
        "$AIRFLOW_DIR/docker-compose.yaml"
      echo "$(date) — Volume projet ajouté dans docker-compose.yaml"

      # ── 7. Installer dbt dans venv ───────────────────────────
      echo "$(date) — Installation dbt dans venv Python..."
      cd "$PROJECT_DIR"
      python3 -m venv venv
      source venv/bin/activate
      pip install --upgrade pip --quiet
      pip install dbt-core dbt-sqlite azure-storage-blob --quiet
      echo "$(date) — dbt installé : $(dbt --version | head -1)"

      # ── 8. Initialiser le projet dbt ─────────────────────────
      echo "$(date) — Initialisation projet dbt..."
      cd "$PROJECT_DIR"
      echo "sqlite" | dbt init dataops_dbt --profiles-dir "$PROJECT_DIR/.dbt" --no-version-check

      # Remplacer modèles d'exemple par nos modèles
      rm -rf "$PROJECT_DIR/dataops_dbt/models/example"
      mkdir -p "$PROJECT_DIR/dataops_dbt/models"
      cp "$PROJECT_DIR/dbt_models/analytics_messages.sql" "$PROJECT_DIR/dataops_dbt/models/"
      cp "$PROJECT_DIR/dbt_models/schema.yml"             "$PROJECT_DIR/dataops_dbt/models/"
      echo "$(date) — Projet dbt prêt"

      deactivate

      # ── 9. Corriger les permissions ──────────────────────────
      chown -R "$ADMIN_USER:$ADMIN_USER" "$PROJECT_DIR"
      echo "$(date) — Permissions corrigées"

      # ── 10. Initialiser Airflow ──────────────────────────────
      echo "$(date) — Initialisation base de données Airflow (airflow-init)..."
      cd "$AIRFLOW_DIR"
      docker compose up airflow-init
      echo "$(date) — airflow-init terminé"

      # ── 11. Démarrer tous les services Airflow ───────────────
      echo "$(date) — Démarrage Airflow (docker compose up -d)..."
      docker compose up -d
      echo "$(date) — Services démarrés"

      # ── 12. Attendre que le webserver soit healthy ───────────
      echo "$(date) — Attente webserver healthy (max 10 min)..."
      ATTEMPTS=0
      until docker compose ps | grep "airflow-webserver" | grep -q "healthy"; do
        sleep 15
        ATTEMPTS=$((ATTEMPTS + 1))
        echo "$(date) — Tentative $ATTEMPTS/40..."
        if [ $ATTEMPTS -ge 40 ]; then
          echo "$(date) — TIMEOUT webserver, on continue quand même"
          break
        fi
      done
      echo "$(date) — Webserver prêt (ou timeout)"

      # ── 13. Injecter la variable Airflow ─────────────────────
      echo "$(date) — Injection variable azure_storage_connection_string..."
      CONN_STR="${storage_connection_string}"
      docker compose exec -T airflow-webserver \
        airflow variables set azure_storage_connection_string "$CONN_STR" \
        || echo "$(date) — WARNING: injection variable échouée, à faire manuellement"

      # ── 14. Activer et déclencher le DAG ─────────────────────
      echo "$(date) — Activation du DAG dataops_pipeline..."
      docker compose exec -T airflow-scheduler \
        airflow dags unpause dataops_pipeline \
        || echo "$(date) — WARNING: unpause échoué"

      echo "$(date) — Déclenchement initial du DAG..."
      docker compose exec -T airflow-scheduler \
        airflow dags trigger dataops_pipeline \
        || echo "$(date) — WARNING: trigger échoué"

      echo "=========================================="
      echo "$(date) — DÉPLOIEMENT TERMINÉ"
      echo "Airflow : http://$(curl -s http://169.254.169.254/metadata/instance/network/interface/0/ipv4/ipAddress/0/publicIpAddress?api-version=2021-02-01&format=text 2>/dev/null || echo '<IP_VM>'):8080"
      echo "Login   : airflow / ${airflow_admin_password}"
      echo "=========================================="

runcmd:
  # ── Installer Docker ─────────────────────────────────────────
  - ["bash", "-c", "curl -fsSL https://get.docker.com | sh"]
  - ["bash", "-c", "systemctl enable docker && systemctl start docker"]
  - ["bash", "-c", "apt-get install -y docker-compose-plugin"]
  - ["bash", "-c", "usermod -aG docker ${admin_username} || true"]

  # ── Lancer le script de déploiement en arrière-plan ─────────
  # nohup + redirection pour ne pas bloquer cloud-init
  - ["bash", "-c", "nohup bash /opt/deploy_airflow.sh >> /var/log/deploy_airflow.log 2>&1 &"]

final_message: |
  ============================================================
  VM DataOps TP6 — cloud-init terminé après $UPTIME secondes.
  Le script deploy_airflow.sh tourne en arrière-plan.
  Suivre : tail -f /var/log/deploy_airflow.log
  Interface : http://<IP_VM>:8080  (~8-12 min après boot)
  ============================================================
